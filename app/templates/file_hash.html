{% extends 'tool_form.html' %}{% set heading='File Hash Generator' %}{% set subheading='Upload a file and calculate common integrity fingerprints.' %}{% block form %}<form method="post" enctype="multipart/form-data"><input class="form-control mb-3" type="file" name="file" required><button class="btn btn-cyber">Generate Hashes</button></form>{% if hashes %}<div class="mt-4">{% for k,v in hashes.items() %}<label class="fw-bold">{{ k }}</label><code class="d-block hash-box">{{ v }}</code>{% endfor %}</div>{% endif %}{% endblock %}
