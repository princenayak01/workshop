{% extends 'tool_form.html' %}{% set heading='AES Encryption Tool' %}{% set subheading='Encrypt or decrypt text using a secret-derived symmetric key.' %}{% block form %}<form method="post"><textarea class="form-control mb-3" name="text" rows="6" placeholder="Text or token" required></textarea><input class="form-control mb-3" name="secret_key" type="password" placeholder="Secret key" required><button name="action" value="encrypt" class="btn btn-cyber">Encrypt</button><button name="action" value="decrypt" class="btn btn-outline-info">Decrypt</button></form>{% if result %}<div class="mt-4">{% if result.error %}<div class="alert alert-danger">{{ result.error }}</div>{% else %}<textarea class="form-control" rows="5" readonly>{{ result.output }}</textarea>{% endif %}</div>{% endif %}{% endblock %}
